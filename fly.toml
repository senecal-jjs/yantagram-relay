app = 'yantagram-relay'
primary_region = 'sjc'

[build]

[env]
  PORT = '8080'
  DB_PATH = '/data/yantagram-relay.db'
# fly volumes create relay_data --region sjc --size 1

[mounts]
  source = 'relay_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
